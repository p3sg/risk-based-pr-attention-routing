name: Stage npm package

on:
  release:
    types: [published]

permissions: {}

jobs:
  validate:
    name: Validate and pack package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global --ignore-scripts npm@11.21.0

      - name: Verify release tag matches package version
        run: |
          EXPECTED_TAG="v$(node -p "require('./packages/pr-attention-router/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG."
            exit 1
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate router package
        run: npm run check:router

      - name: Audit production dependency surface
        run: npm audit --workspace @p3sg/pr-attention-router --omit=dev

      - name: Audit complete package dependency surface
        run: npm audit --workspace @p3sg/pr-attention-router

      - name: Pack the validated package
        run: |
          mkdir -p .release
          npm pack ./packages/pr-attention-router --ignore-scripts --pack-destination .release
          cd .release
          sha256sum *.tgz > SHA256SUMS

      - name: Retain the validated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.event.release.tag_name }}
          path: |
            .release/*.tgz
            .release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage package for human approval
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global --ignore-scripts npm@11.21.0

      - name: Download the validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          name: npm-package-${{ github.event.release.tag_name }}
          path: release

      - name: Verify and stage the package
        run: |
          cd release
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          tarballs=(*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball."
            exit 1
          fi
          npm stage publish "${tarballs[0]}" --access public
